models:

  Logistic Regression:
    class: sklearn.linear_model.LogisticRegression
    init_params:
      max_iter: 2000
      random_state: 42

  Decision Tree:
    class: sklearn.tree.DecisionTreeClassifier
    init_params:
      random_state: 42

  Random Forest:
    class: sklearn.ensemble.RandomForestClassifier
    init_params:
      random_state: 42
      n_jobs: -1

  Gradient Boosting:
    class: sklearn.ensemble.GradientBoostingClassifier
    init_params:
      random_state: 42

  AdaBoost:
    class: sklearn.ensemble.AdaBoostClassifier
    init_params:
      random_state: 42



  XGBoost:
    class: xgboost.XGBClassifier
    init_params:
      eval_metric: logloss
      random_state: 42
      n_jobs: -1


params:

  Logistic Regression:
    C:
      - 0.01
      - 0.1
      - 1
      - 10
      - 100
    solver:
      - lbfgs
      - liblinear
    penalty:
      - l2
    class_weight:
      - null
      - balanced


  Decision Tree:
    criterion:
      - gini
      - entropy
      - log_loss
    splitter:
      - best
      - random
    max_depth:
      - null
      - 5
      - 10
      - 20
      - 30
    min_samples_split:
      - 2
      - 5
      - 10
      - 20
    min_samples_leaf:
      - 1
      - 2
      - 5
      - 10
    max_features:
      - null
      - sqrt
      - log2
    class_weight:
      - null
      - balanced


  Random Forest:
    n_estimators:
      - 100
      - 200
      - 300
    criterion:
      - gini
      - entropy
      - log_loss
    max_depth:
      - null
      - 10
      - 20
      - 30
    min_samples_split:
      - 2
      - 5
      - 10
    min_samples_leaf:
      - 1
      - 2
      - 4
    max_features:
      - sqrt
      - log2
      - null
    bootstrap:
      - true
      - false
    class_weight:
      - null
      - balanced
      - balanced_subsample


  Gradient Boosting:
    loss:
      - log_loss
      - exponential
    learning_rate:
      - 0.01
      - 0.05
      - 0.1
    n_estimators:
      - 100
      - 200
      - 300
    subsample:
      - 0.8
      - 1.0
    criterion:
      - friedman_mse
      - squared_error
    max_depth:
      - 3
      - 5
      - 7
    min_samples_split:
      - 2
      - 5
      - 10
    min_samples_leaf:
      - 1
      - 2
      - 5
    max_features:
      - null
      - sqrt
      - log2


  AdaBoost:
    n_estimators:
      - 50
      - 100
      - 200
      - 300
    learning_rate:
      - 0.01
      - 0.05
      - 0.1
      - 0.5
      - 1.0

  XGBoost:
    n_estimators:
      - 100
      - 200
      - 300
      - 500

    learning_rate:
      - 0.01
      - 0.05
      - 0.1

    max_depth:
      - 3
      - 5
      - 7
      - 10

    min_child_weight:
      - 1
      - 3
      - 5
      - 10

    subsample:
      - 0.8
      - 1.0

    colsample_bytree:
      - 0.8
      - 1.0

    gamma:
      - 0
      - 0.1
      - 0.3

    reg_alpha:
      - 0
      - 0.01
      - 0.1

    reg_lambda:
      - 1
      - 5
      - 10

    scale_pos_weight:
      - 1
      - 3
      - 5
      - 8
      - 10
      - 12